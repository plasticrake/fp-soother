name: "Publish release to PyPI"

on:
  push:
    tags:
      # Per-package tags created by scripts/release, e.g. fp-soother-lib/v1.0.3
      - "fp-soother-*/v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs:
      - ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Resolve package from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="${TAG%%/*}"
          version="${TAG#*/v}"
          if [[ ! -f "packages/${package}/pyproject.toml" ]]; then
            echo "::error::Unknown package '${package}' in tag '${TAG}'"
            exit 1
          fi
          project_version="$(uv version --package "$package" --short)"
          if [[ "$project_version" != "$version" ]]; then
            echo "::error::Tag version '${version}' does not match ${package} version '${project_version}'"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "module=${package//-/_}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: uv build --package "$PACKAGE" --no-sources --out-dir dist

      - name: Smoke test (wheel)
        env:
          MODULE: ${{ steps.tag.outputs.module }}
        run: uv run --isolated --no-project --with dist/*.whl python -c "import ${MODULE}"
      - name: Smoke test (source distribution)
        env:
          MODULE: ${{ steps.tag.outputs.module }}
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import ${MODULE}"

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish
